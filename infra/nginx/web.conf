# The web container's only site: serves the built frontend and proxies /api to
# the API on the same origin (ADR 0010). Replaces the image's default.conf.

server {
    # nginx-unprivileged cannot be told to use 80 on a real host; inside Docker
    # 8080 is published like any port.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # No nginx version in the Server header or error pages: free information for
    # anyone matching a version to its CVEs.
    server_tokens off;

    # Text compresses 3-5x (the JS bundle was 390 kB → 123 kB in 1.6f). Off by
    # default in nginx. Already-compressed formats (woff2, images) are left out.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite names these by content hash: a changed file gets a new name, so the
    # browser may keep them for a year without asking. A missing one is a real
    # 404 - never the SPA fallback, or a typo'd script would load index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The API, same origin. No URI after the host: the request path goes through
    # unchanged, /api prefix included - the API owns it. "http://api:3000/" with
    # a trailing slash would strip /api, which ADR 0010 rejected.
    location /api/ {
        proxy_pass http://api:3000;

        # Without these the API sees every request as coming from nginx.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the app. A path with no file behind it (a reload on an
    # app route) gets index.html, and React Router decides. index.html is never
    # cached: it names the current asset files, so a stale copy pins a user to
    # last release's JavaScript.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
