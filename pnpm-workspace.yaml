packages:
  - apps/*

# Packages allowed to run postinstall scripts. pnpm blocks all of them by
# default - a postinstall runs arbitrary code at install time, which is the
# most common route a compromised package takes to a developer's machine.
# Each entry here is a deliberate decision, not a convenience.
allowBuilds:
  # Downloads Prisma's query engine binary. Without it the client never
  # generates, and the failure surfaces much later as a missing import.
  '@prisma/engines': true
  prisma: true

  # Arrives as a transitive dependency of httpyac's gRPC support, which this
  # project does not use - only HTTP requests. Its postinstall generates bundled
  # files for that feature, so skipping it costs nothing we touch. Recorded as a
  # decision rather than left undecided, because pnpm keeps asking otherwise.
  protobufjs: false

  # Install-time analytics: its postinstall reports telemetry about this machine
  # to a third party. Arrives via @nestjs/swagger. Declined for the same reason
  # @nestjs/observe was in 1.3a - nothing leaves this project by default.
  '@scarf/scarf': false

# pnpm refuses packages published within the last few days, because a
# compromised release is most dangerous in its first hours. This is a deliberate
# override of that policy for one package: pino-pretty is a dev dependency used
# only to colour local logs, and never reaches the production image.
#
# Remove the exclusion once the version has aged past the threshold.
minimumReleaseAgeExclude:
  - pino-pretty@13.2.0
